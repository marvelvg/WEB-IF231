<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TESTING UI
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
  body {
    margin: 0;
  }
</style>

<body id="parent" class="">
  <div class="container shadow bg-light">
    <div class="p-3">
      <h2 class="" id="header"> Belum di sapa</h2>
      <button id="btn" class="btn btn-primary">Sapa</button>
    </div>
  </div>

  <div class="container shadow mt-5 bg-light">
    <h1 id="angka" class="text-warning w-70 ms-3">0</h1>
    <div class="btn-group p-3">
      <button id="x" class="btn btn-danger">+</button>
      <button id="y" class="btn btn-warning">-</button>

    </div>

    <button id="reset" class="btn btn-primary">Reset</button>
  </div>
  </div>

  <div class="container shadow mt-5 bg-light">
    <h3 class="text-success p-3"> Daftar Tugas </h3>

    <form class="p-3">
      <div class="form-floating d-flex">
        <input type="text" id="Assignment" class="form-control" placeholder="daftar tugas">
        <label class="form-label" for="Assignment"> daftar tugas</label>
        <button id="tambah" type="button" class="btn btn-primary">Tambah</button>

      </div>
      <ul id="list"></ul>


    </form>

  </div>

  <div class="container shadow mt-5 bg-light">
        <h2>Dark Mode</h2>

        <form class="p-1">
          <div class="form-check form-switch">
              <input 
              id="darkMode"
              role="switch"
              type="checkbox" class="form-check-input">
          </div>
        </form>
  </div>

  <div class="container shadow mt-5">
    <form id="email"  class="p-1" novalidate>
        <div class="form-floating d-flex">
            <input id="input"  class="form-control" type="email" placeholder="email@gmail.com" required>
            <label class="form-label"  type="label" for="input">email@gmail.com</label>
            <button class="btn btn-primary" type="submit">SEND</button>
        </div>
    </form>

    <p class="msg mt-2" id="pesan"></p>
  </div>
</body>

<script>

const form = document.getElementById("email");
const input = document.getElementById("input");
const pesan = document.getElementById("pesan");

form.addEventListener('submit', e => {
  if(!form.checkValidity()){
    pesan.textContent = "email salah";
    e.preventDefault()
  } 
  else{
    pesan.textContent = "email valid";
    e.preventDefault()
    input.disabled = true;
  }

  form.classList.add('was-validated')
  
})









const darkMode = document.getElementById("darkMode");
const parent = document.getElementById("parent");

darkMode.addEventListener("click", ()=>{
    if(darkMode.checked){
      parent.setAttribute("class", "bg-dark")
    }
    else if(!darkMode.checked){
      parent.setAttribute("class", "bg-light")
    }
})

  const a = document.getElementById('header');
  const b = document.getElementById('btn');

  console.log(a.getAttribute("class") ? "yes" : "kntl");
  let tombol = false;

  b.addEventListener("click", () => {
    tombol = !tombol;
    // a.innerHTML = tombol ? "Halo mas" : "Belum di sapa";
    // a.setAttribute("class", tombol ? "text-danger" : "text-dark");

    // Cara 2
    a.textContent = tombol ? "Halo mas" : "Belum di sapa";
    a.style.color = tombol ? "#1d4ed8" : "";
  })


  const p = document.getElementById("angka");
  console.log(p.textContent);


  // First Button
  const x = document.getElementById("x");
  x.addEventListener("click", () => {
    const current = parseInt(p.textContent);
    p.innerHTML = current + 1;

  })

  // Second Button
  const y = document.getElementById("y");
  y.addEventListener("click", () => {
    const current = parseInt(p.textContent);
    p.innerHTML = current - 1;

  })

  // Reset Button
  const reset = document.getElementById("reset");

  reset.addEventListener("click", () => {
    const current = parseInt(p.textContent);
    p.innerHTML = "0";
  })


  const tambahNode = document.getElementById("tambah");
  const CurrentNode = document.getElementById("Assignment");

  const list = document.getElementById("list");
  tambahNode.addEventListener("click", () => {
    const teks = CurrentNode.value.trim();
    if (!teks) return "gagal fetch data";

    const li = document.createElement('li');
    li.addEventListener('click', () => li.remove());

    li.textContent = teks;
    list.appendChild(li);
    CurrentNode.value='';

  })




</script>

</html>
