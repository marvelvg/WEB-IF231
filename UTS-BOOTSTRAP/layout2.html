<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Another UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body id="body">
    <div id="kotak" class="container shadow mt-5 p-5 ">
        <form id="anjay">
            <div class="form-floating d-flex">
                <input id="tugas" type="text" class="form-control" placeholder="Tugas" required>
                <label class="form-label" id="tugas">Tugas</label>
                <button class="btn btn-primary" type="submit">Submit</button>
            </div>

        </form>
        <ul id="Daftar-Tugas" class="container">

        </ul>
    </div>


    <div class="container shadow mt-5 ">
        <h1> Dark Mode</h1>
        <form id="isi">
            <input id="input" type="checkbox">
        </form>
    </div>

    <div class="container shadow mt-5 p-5">
        <form class="form-floating">
            <input class="form-control" id="x" type="text" placeholder="Masukkan bahasa">
            <label for="x" class="form-label">Masukkan bahasa</label>
        </form>

        <ul id="y">
            <li>Javascript</li>
            <li>C</li>
            <li>Rust</li>
            <li>Golang</li>
            <li>Python</li>
            <li>C++</li>
            <li>R</li>
        </ul>

    </div>


    <div class="container shadow mt-5">
        <button id="muat-data" class="btn btn-primary"> Muat Data </button>
        <p class="text-primary" id="message"></p>
        <ul id="keranjang"></ul>
    </div>


</body>

<script>
    const link = "https://jsonplaceholder.typicode.com/users";
    const keranjang = document.getElementById("keranjang");



    async function anjay() {
        keranjang.innerHTML = "";

        try {
            const simpan = await fetch(link);
            const receive = await simpan.json();


            receive.forEach((data, index) => {
                const isiKeranjang = document.createElement("li")

                isiKeranjang.textContent = data.name;
                keranjang.appendChild(isiKeranjang);
            })

        } catch (err) {
            const message = document.getElementById("message");
            message.textContent = "Error Mas....";
        };

    }

    const successor = document.getElementById("muat-data");
    let toggler = false;


    successor.addEventListener('click', () => {
        const message = document.getElementById("message");

        if (!toggler) {
            message.textContent = "memuat data....";

            setTimeout(() => {
                anjay();
            }, 900);

            setTimeout(() => {
                message.textContent = " ";
            }, 900)
            toggler = true;
        }
        else {
            keranjang.innerHTML = "";
            toggler = false;
        }

    })



















    const bahasa = document.getElementById("x");
    const DaftarBahasa = document.querySelectorAll("#y li");

    // map cuma bisa untuk array kalo node list biasana harus pake for eadch
    // metode berikut adalah metode mengubah node list menjadi array
    [...DaftarBahasa].map((bahasa, index) => {
        console.log(bahasa.textContent);
    })

    bahasa.addEventListener('input', () => {
        const match = bahasa.value.toLowerCase();

        DaftarBahasa.forEach((item) => {
            const namaBahasa = item.textContent.toLowerCase();

            if (namaBahasa.includes(match)) {
                // Fungsi buat reset none
                item.style.display = "";
            }

            else {
                item.style.display = "none"
            }
        });

    });




    const check = document.getElementById("input");
    const body = document.getElementById("body");

    // Local
    const saveMode = localStorage.getItem("darkMode");

    if (saveMode === "true") {
        body.classList.add("bg-dark");
        check.checked = true;
    }

    check.addEventListener('click', () => {
        if (check.checked) {
            body.classList.add("bg-dark");
            localStorage.setItem("darkMode", "true");

        }

        else {
            body.classList.remove("bg-dark");
            localStorage.setItem("darkMode", "false");

        }
    })


    const form = document.getElementById("anjay");
    const input = document.getElementById("tugas");
    const List = document.getElementById("Daftar-Tugas");
    const kotak = document.getElementById("kotak");

    console.log(form, input, List, kotak);
    form.addEventListener('submit', e => {

        if (!input) return;
        const node = document.createElement('li');
        const hapus = document.createElement('button');

        hapus.textContent = "Hapus";
        hapus.classList.add("btn");
        hapus.classList.add("delete-btn");
        hapus.classList.add("btn-danger");
        hapus.classList.add("ms-2");
        hapus.classList.add("my-2");

        hapus.type = 'button';


        node.textContent = input.value;
        List.appendChild(node);
        node.appendChild(hapus);
        saveTugas();

        input.value = "";
        e.preventDefault();


    })

    List.addEventListener('click', e => {
        const tombol = e.target.closest('.delete-btn');
        if (!tombol) return;

        tombol.parentElement.remove();
        saveTugas();
    })

    function saveTugas() {
        localStorage.setItem("Daftar-Tugas", List.innerHTML);
    }
    List.innerHTML = localStorage.getItem("Daftar-Tugas");

</script>

</html>
